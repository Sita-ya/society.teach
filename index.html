<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老街與生活｜試教互動網頁</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF8F5; --ink:#2B2B2B; --brick:#B5533C; --brick-l:#F5E6E0; --brick-m:#E3B4A6;
  --indigo:#2F4A6D; --indigo-l:#E2E8F0;
  --g1:#5C5C5C; --g2:#8E8E8E; --g3:#C8C4BE; --g4:#E4E0DA; --g5:#F1EEE9; --line:#DCD7D0;
  --ok:#3F7D58; --ok-l:#E2EFE6; --bad:#C0392B;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
#viewport{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  background:var(--bg);overflow:hidden;font-size:30px;line-height:1.5}

/* ---------- 頂端階段進度條 ---------- */
#progress{position:absolute;left:80px;top:18px;width:960px;display:grid;
  grid-template-columns:2fr 5fr 2fr;grid-column-gap:10px;z-index:5}
.pg{font-size:20px;color:var(--g2);letter-spacing:3px;padding-bottom:5px;border-bottom:5px solid var(--g4);transition:color .3s,border-color .3s}
.pg.on{color:var(--brick);border-color:var(--brick);font-weight:700}
.pg.past{border-color:var(--brick-m)}

/* ---------- 頁首 ---------- */
#page{position:absolute;left:0;top:0;width:1920px;height:1080px}
.head{position:absolute;left:80px;top:62px;right:540px;height:90px;display:flex;align-items:center;white-space:nowrap}
.pill{font-size:22px;color:var(--brick);background:var(--brick-l);border-radius:999px;padding:4px 16px;margin-right:20px;letter-spacing:2px}
.head h1{font-size:52px;font-weight:700;letter-spacing:2px}
.chip{font-size:24px;border:1.5px solid var(--indigo);color:var(--indigo);border-radius:10px;padding:2px 12px;margin-left:18px}
.badge{font-size:24px;background:var(--indigo);color:#fff;border-radius:10px;padding:3px 14px;margin-left:18px;letter-spacing:1px}
.backmap{font-size:22px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 16px;margin-left:24px;color:var(--g1)}
.backmap:hover{border-color:var(--brick);color:var(--brick)}
.body{position:absolute;left:80px;top:170px;width:1760px;height:850px}
.ab{position:absolute}

/* ---------- 逐步揭曉 ---------- */
.rv{opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity 260ms ease,transform 260ms ease,visibility 0s linear 260ms}
.rv.on{opacity:1;visibility:visible;transform:none;transition:opacity 260ms ease,transform 260ms ease,visibility 0s}
.pop.on{animation:pop 380ms ease-out}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 文字元件 ---------- */
.q{font-size:40px;font-weight:700;line-height:1.4;border-left:8px solid var(--brick);padding:4px 0 4px 24px}
.q.sm{font-size:34px}
.lv{display:inline-block;font-size:20px;font-weight:400;color:var(--g2);border:1px solid var(--g3);border-radius:8px;padding:0 8px;margin-left:14px;vertical-align:middle;line-height:1.5}
.points{list-style:none}
.points li{position:relative;padding-left:34px;margin-bottom:12px;line-height:1.45}
.points li:before{content:"";position:absolute;left:6px;top:.55em;width:12px;height:12px;border-radius:50%;background:var(--brick)}
.points b,.hl{color:var(--brick);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;grid-column-gap:48px}
.card-soft{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px 28px}
.lead{font-size:24px;color:var(--g2);letter-spacing:2px;margin-bottom:6px}

/* 學生可能回答泡泡 */
.bubbles{display:block}
.bubble{display:inline-block;background:var(--g5);border:1px solid var(--g4);color:var(--g1);
  border-radius:24px 24px 24px 6px;padding:8px 24px;font-size:28px;margin:0 16px 12px 0;white-space:nowrap}
.bubble .who{font-size:22px;color:var(--g2);margin-right:6px}
.bubble .tag0{font-size:18px;color:var(--g2);border:1px solid var(--g3);border-radius:6px;padding:0 6px;margin-right:10px;vertical-align:middle}
body.nob .bubble{visibility:hidden}

/* ---------- 圖片 ---------- */
.fig{position:absolute}
.imgbox{position:absolute;left:0;top:0;width:100%;height:100%;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.imgbox img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
.fig .figcap{position:absolute;left:0;width:100%;text-align:center;font-size:28px;color:var(--g1)}
.fig .ph{display:none;position:absolute;left:0;top:0;width:100%;height:100%;background:#ECEAE6;border:1.5px dashed var(--g3);border-radius:14px;
  color:var(--g2);font-size:26px;align-items:center;justify-content:center;text-align:center;line-height:1.4;flex-direction:column}
.fig.err .ph{display:flex}
.fig.err .imgbox,.fig.err .figcap{display:none}
.hs{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:var(--brick);color:#fff;
  font-size:36px;font-weight:700;display:flex;align-items:center;justify-content:center;border:4px solid #fff;z-index:2}
.hs:after{content:"";position:absolute;left:-12px;top:-12px;width:84px;height:84px;border-radius:50%;border:3px solid var(--brick);opacity:.6;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.35);opacity:0}}

/* ---------- 封面 ---------- */
.cover-mask{position:absolute;left:0;top:0;width:1920px;height:1080px;background:rgba(250,248,245,.55)}
.cover-box:before{content:"";position:absolute;left:360px;right:360px;top:-50px;bottom:-40px;background:rgba(250,248,245,.82);border-radius:28px;z-index:-1}
.cover-fig .imgbox{border:none;border-radius:0;background:transparent}
.cover-box{position:absolute;left:0;width:1920px;top:300px;text-align:center;z-index:1}
.cover-box h1{font-size:140px;letter-spacing:24px;font-weight:700;color:var(--ink);line-height:1.2}
.cover-box .line{width:120px;height:6px;background:var(--brick);margin:28px auto;border-radius:3px}
.cover-box .sub{font-size:36px;color:var(--g1);letter-spacing:2px}
.cover-box .who{font-size:30px;color:var(--g1);margin-top:30px}
.cover-hint{position:absolute;left:0;width:1920px;bottom:70px;text-align:center;font-size:22px;color:var(--g2)}

/* ---------- 第 1 頁 ---------- */
.tag{display:inline-block;font-size:30px;font-weight:700;color:var(--brick);border:2px solid var(--brick);border-radius:999px;padding:4px 26px;margin-right:18px;background:#fff}
.tag-lead{display:inline-block;font-size:28px;color:var(--g1);margin-right:14px}
.mission{display:flex;align-items:center;background:var(--brick-l);border:2px solid var(--brick);border-radius:18px;padding:16px 26px;font-size:30px;font-weight:700;color:var(--ink)}
.mission svg{width:88px;height:88px;flex:none;margin-right:22px}

/* ---------- 地圖、集章卡 ---------- */
.stampcard{background:#fff;border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:150px 1fr 1fr 1fr 1fr;align-items:center;padding:0 20px}
.sc-t{font-size:30px;font-weight:700;color:var(--brick);letter-spacing:4px;text-align:center;border-right:1px solid var(--line);line-height:1.3}
.sc-t small{display:block;font-size:20px;color:var(--g2);font-weight:400;letter-spacing:1px}
.cell{display:flex;align-items:center;justify-content:center}
.seal{width:96px;height:96px;border-radius:50%;border:3px dashed var(--g3);display:flex;align-items:center;justify-content:center;color:var(--g3);font-size:40px;flex:none}
.cell.got .seal{border:none}
.seal svg{width:96px;height:96px}
.cn{font-size:26px;color:var(--g1);margin-left:14px;line-height:1.3}
.cell.got .cn{color:var(--brick);font-weight:700}
.stamping{animation:stamp 420ms cubic-bezier(.3,1.4,.5,1)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-20deg);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.mapbox{border-radius:18px;overflow:hidden}
.mapbox svg.map{position:absolute;left:0;top:0;width:100%;height:100%}
.mapbtn{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:#fff;border:4px solid var(--brick);
  color:var(--brick);font-size:44px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .2s}
.mapbtn:hover{transform:scale(1.08)}
.mapbtn .mb-l{position:absolute;top:100px;left:50%;width:220px;margin-left:-110px;font-size:26px;color:var(--ink);background:rgba(255,255,255,.92);border-radius:8px;padding:2px 0;line-height:1.3;font-weight:700}
.mapbtn.done{background:var(--brick);color:#fff}
.mapbtn.done svg{width:52px;height:52px}
.mapbtn.next{box-shadow:0 0 0 8px rgba(181,83,60,.18)}
.mapnote{position:absolute;left:18px;bottom:14px;font-size:22px;color:var(--g1);background:rgba(255,255,255,.9);border-radius:8px;padding:4px 14px}
.done-banner{position:absolute;left:50%;top:50%;width:640px;margin:-80px 0 0 -320px;height:160px;border-radius:24px;background:var(--brick);color:#fff;
  font-size:60px;font-weight:700;letter-spacing:6px;display:flex;align-items:center;justify-content:center;z-index:3}
.done-banner small{display:block}

/* 站點：選項卡片 */
.opts4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-column-gap:24px}
.opt{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 24px;font-size:32px;cursor:pointer;user-select:none;transition:opacity .25s,background .25s,border-color .25s,color .25s}
.opt:hover{border-color:var(--g2)}
.opt .ol{display:inline-block;width:46px;height:46px;line-height:44px;text-align:center;border-radius:50%;border:2px solid var(--g3);font-size:26px;margin-right:16px;color:var(--g1);vertical-align:middle}
.opt.sel{border-color:var(--indigo);background:var(--indigo-l)}
.opt.ok{border-color:var(--ok);background:var(--ok-l);color:var(--ok);font-weight:700;animation:pop 380ms ease-out}
.opt.ok .ol{border-color:var(--ok);color:var(--ok)}
.opt.dim{opacity:.32}
.opt .mk{position:absolute;right:18px;top:50%;margin-top:-22px;width:44px;height:44px;display:none}
.opt.ok .mk,.opt.right .mk{display:block}
.optlist .opt{font-size:28px;padding:12px 22px;margin-bottom:12px}
.opt .box{display:inline-block;width:32px;height:32px;border:2px solid var(--g3);border-radius:7px;margin-right:16px;vertical-align:middle;position:relative;top:-2px}
.opt.sel .box{background:var(--indigo);border-color:var(--indigo)}
.opt.right{border-color:var(--indigo);background:var(--indigo);color:#fff;font-weight:700;animation:pop 380ms ease-out}
.opt.right .box{background:#fff;border-color:#fff}
.stampbtn{font-size:28px;font-weight:700;background:var(--brick);color:#fff;border:none;border-radius:14px;padding:14px 28px;display:flex;align-items:center}
.stampbtn svg{width:40px;height:40px;margin-right:12px}

/* ---------- 第 3 頁 ---------- */
.wiki{background:#fff;border:2px solid var(--indigo);border-radius:18px;padding:18px 26px}
.wiki .wt{display:inline-block;background:var(--indigo);color:#fff;font-size:24px;border-radius:8px;padding:2px 12px;margin-bottom:8px;letter-spacing:2px}
.wiki .wb{font-size:32px}
.slots{display:flex;align-items:center;justify-content:center}
.slot{position:relative;width:330px;height:130px;border:3px dashed var(--g3);border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .2s}
.slot .sn{position:absolute;left:10px;top:4px;font-size:20px;color:var(--g2)}
.slot.hover{border-color:var(--indigo);background:var(--indigo-l)}
.slot.good{border:3px solid var(--ok);background:var(--ok-l)}
.slot.good .card{border-color:var(--ok);color:var(--ok)}
.slot.bad{border:3px solid var(--bad)}
.slot.shake{animation:shake 420ms}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
.slot.lit{animation:lit 500ms ease-out both}
@keyframes lit{0%{background:#fff;transform:scale(.92)}60%{transform:scale(1.06)}100%{background:var(--ok-l);transform:scale(1)}}
.arr{width:70px;height:36px;color:var(--g2);margin:0 12px;flex:none}
.pool{display:flex;justify-content:center;align-items:center;min-height:150px;border-radius:18px;background:var(--g5);border:1px solid var(--g4)}
.card{width:290px;height:100px;background:#fff;border:2.5px solid var(--brick);color:var(--brick);border-radius:14px;font-size:34px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;margin:0 18px}
.slot .card{margin:0;width:290px}
.card.sel{background:var(--brick);color:#fff;transform:translateY(-6px)}
.card.dragging{opacity:.25}
.ghost{position:absolute;z-index:60;pointer-events:none;margin:0;opacity:.92;transform:rotate(-3deg)}
.hint{font-size:24px;color:var(--g2)}
.btn{font-size:30px;font-weight:700;border-radius:14px;padding:12px 30px;border:2px solid var(--indigo);background:var(--indigo);color:#fff}
.btn.ghostbtn{background:#fff;color:var(--indigo)}
.msg-ok{font-size:30px;color:var(--ok);font-weight:700}

/* ---------- 第 4 頁 ---------- */
.cmp .ct{font-size:28px;font-weight:700;color:#fff;display:inline-block;border-radius:8px;padding:2px 16px;margin-bottom:8px}
.cmp .cb{font-size:32px}
.list3 .it{display:flex;align-items:flex-start;margin-bottom:18px;font-size:28px;line-height:1.45}
.list3 .n{flex:none;width:52px;height:52px;border-radius:50%;background:var(--brick);color:#fff;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;margin-right:16px}
.big-sum{font-size:56px;font-weight:700;color:var(--brick);letter-spacing:4px}
table.cmpt{border-collapse:separate;border-spacing:0;width:100%;font-size:32px;background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
table.cmpt th{background:var(--g5);font-weight:700;padding:12px 20px;text-align:center;border-bottom:1.5px solid var(--line)}
table.cmpt th:first-child{color:var(--brick)} table.cmpt th:last-child{color:var(--indigo)}
table.cmpt td{padding:12px 20px;text-align:center;border-bottom:1px solid var(--g4)}
table.cmpt td:first-child{border-right:1px solid var(--g4)}
table.cmpt tr:last-child td{border-bottom:none}

/* ---------- 板書 ---------- */
.bd-title{font-size:40px;font-weight:700;color:var(--brick);margin-bottom:14px;letter-spacing:2px}
.bd-empty{font-size:26px;color:var(--g2)}
.bd-blk{border:1.5px solid var(--line);border-radius:16px;padding:14px 20px;margin-bottom:16px;background:#fff;transition:opacity .3s,background .3s,border-color .3s}
.bd-h{font-size:28px;font-weight:700;margin-bottom:8px}
.chain{display:flex;align-items:center;flex-wrap:wrap}
.chain .cb{border:2px solid var(--brick);color:var(--brick);border-radius:10px;padding:2px 12px;font-size:26px;font-weight:700;background:#fff}
.chain .arr{width:36px;height:20px;margin:0 6px;color:var(--g2)}
.bd-row{font-size:26px;margin:4px 0;line-height:1.5}
.bk{display:inline-block;font-size:22px;background:var(--indigo);color:#fff;border-radius:6px;padding:0 10px;margin-right:10px;vertical-align:middle}
.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%{background:#F8D9CE}100%{background:transparent}}
.bd-blk.fresh{animation:freshb 2.4s ease-out}
@keyframes freshb{0%{background:#F8D9CE}100%{background:#fff}}
#board{position:absolute;top:0;right:0;bottom:0;width:700px;background:var(--bg);border-left:1.5px solid var(--line);z-index:20;
  padding:130px 34px 30px;transform:translateX(102%);transition:transform 300ms ease;overflow:hidden}
#board.open{transform:none}
#board .bh{position:absolute;left:34px;top:40px;font-size:24px;color:var(--g2);letter-spacing:3px}
#boardTab{position:absolute;right:0;top:470px;width:44px;padding:14px 0;background:#fff;border:1px solid var(--line);border-right:none;border-radius:12px 0 0 12px;
  font-size:22px;color:var(--g2);text-align:center;line-height:1.25;z-index:19;cursor:pointer;opacity:.7}
#boardTab:hover{opacity:1;color:var(--brick)}
#boardTab .dot{display:none;width:12px;height:12px;border-radius:50%;background:var(--brick);margin:6px auto 0}
#boardTab.new .dot{display:block;animation:ring2 1s ease-in-out infinite alternate}
@keyframes ring2{from{transform:scale(.7)}to{transform:scale(1.2)}}
/* 第 5 頁全畫面板書 */
.bigboard .bd-blk{padding:22px 34px;margin-bottom:22px}
.bigboard .bd-h{font-size:38px}
.bigboard .chain .cb{font-size:42px;padding:6px 26px;border-width:3px}
.bigboard .chain .arr{width:70px;height:34px;margin:0 14px}
.bigboard .bd-row{font-size:36px}
.bigboard .bk{font-size:30px;padding:2px 14px}
.bigboard .grid2 .bd-row{margin:6px 0}
.bigboard.hiliting .bd-blk{opacity:.38}
.bigboard.hiliting .bd-blk.hi{opacity:1;border-color:var(--brick);border-width:3px;background:var(--brick-l);animation:pop 380ms ease-out}

/* ---------- 第 6 頁 ---------- */
.qno{font-size:26px;color:var(--brick);letter-spacing:3px;font-weight:700;margin-bottom:10px}
.tf{font-size:46px;font-weight:700;line-height:1.45;text-align:center}
.oxrow{display:flex;justify-content:center}
.ox{width:300px;height:250px;border:3px solid var(--line);border-radius:28px;background:#fff;margin:0 50px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .3s,border-color .3s,background .3s}
.ox svg{width:170px;height:170px}
.ox.o{color:var(--indigo)} .ox.x{color:var(--brick)}
.ox.ok{border-color:var(--ok);background:var(--ok-l);animation:pop 380ms ease-out}
.ox.dim{opacity:.25}
.ox.sel{border-color:var(--g1)}
.ans{font-size:36px;font-weight:700;color:var(--ok);text-align:center}
.ans small{display:block;font-size:30px;color:var(--g1);font-weight:400;margin-top:6px}
.final-t{font-size:72px;font-weight:700;text-align:center;color:var(--brick);letter-spacing:4px}
.scores{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-column-gap:36px}
.sc{position:relative;background:#fff;border:2px solid var(--line);border-radius:22px;text-align:center;padding:30px 0 20px}
.sc .t{font-size:32px;color:var(--g1)}
.sc .v{font-size:96px;font-weight:700;color:var(--ink);line-height:1.15}
.sc.top{border-color:var(--brick);background:var(--brick-l)}
.sc.top .v{color:var(--brick)}
.sc .crown{position:absolute;left:50%;top:-58px;width:100px;height:80px;margin-left:-50px}
.homework{display:flex;align-items:center;border:2px dashed var(--indigo);border-radius:20px;padding:18px 30px;background:#fff;font-size:34px}
.homework .hl2{flex:none;background:var(--indigo);color:#fff;font-size:26px;border-radius:10px;padding:4px 16px;margin-right:24px}

/* ---------- 第 7 頁 ---------- */
.links h3{font-size:34px;color:var(--brick);margin-bottom:14px;border-bottom:2px solid var(--brick-m);padding-bottom:6px}
.links ul{list-style:none}
.links li{font-size:28px;margin-bottom:10px;line-height:1.4}
.links a{color:var(--indigo);text-decoration:none;border-bottom:1px solid var(--indigo-l)}
.links a:hover{border-bottom-color:var(--indigo)}
.links .k{font-size:20px;border:1px solid var(--g3);color:var(--g2);border-radius:6px;padding:0 6px;margin-right:10px;vertical-align:middle}

/* ---------- 全域小工具 ---------- */
#score{position:absolute;right:26px;top:16px;z-index:30;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:6px 8px;display:flex}
#score.hide{display:none}
.team{min-width:100px;text-align:center;border-radius:12px;padding:2px 10px;cursor:pointer;user-select:none}
.team:hover{background:var(--g5)}
.team .tn{font-size:20px;color:var(--g1);display:block;line-height:1.3}
.team .ts{font-size:40px;font-weight:700;color:var(--brick);display:block;line-height:1.1}
.bump{animation:bump 320ms ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}

#modal{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:80;background:rgba(43,43,43,.32);display:none;align-items:center;justify-content:center}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:22px;padding:40px 52px;min-width:720px;max-width:1300px;border:1px solid var(--line);animation:fadeIn 220ms}
.mbox h2{font-size:40px;margin-bottom:18px}
.mbox p{font-size:28px;color:var(--g1)}
.mbtns{margin-top:30px;text-align:right}
.mbtns button{font-size:26px;border-radius:12px;padding:10px 28px;margin-left:14px;border:1.5px solid var(--line);background:#fff}
.mbtns .danger{background:var(--brick);border-color:var(--brick);color:#fff}
.keys{display:grid;grid-template-columns:1fr 1fr;grid-column-gap:50px;font-size:24px;line-height:1.85}

#toast{position:absolute;left:50%;top:120px;width:500px;margin-left:-250px;text-align:center;z-index:90;font-size:24px;background:var(--ink);color:#fff;border-radius:12px;padding:10px;display:none}

#notesView{display:none;position:fixed;left:0;top:0;right:0;bottom:0;overflow:auto;background:#fff;color:#222;font-size:16px;line-height:1.6;padding:28px 36px}

#notesView .tools{position:sticky;top:0;background:#fff;padding:6px 0 10px;text-align:right}
#notesView .tools button{font-size:15px;padding:6px 16px;border:1px solid #bbb;border-radius:8px;background:#fff;margin-left:8px}
#notesView table{width:100%;border-collapse:collapse;font-size:14px}

#notesView .lvl{display:inline-block;font-size:12px;border:1px solid #888;border-radius:4px;padding:0 4px;margin-right:4px}
#notesView .flow{display:flex;margin-bottom:14px}
#notesView .flow div{flex:1;border:1px solid #999;padding:6px 10px;margin-right:-1px}
@media print{

  thead{display:table-header-group}
}

function fitFig(f) {
  var img = f.querySelector("img"), box = f.querySelector(".imgbox");
  if (!img || !img.naturalWidth) return;
  var W = f.clientWidth, H = f.clientHeight;
  if (!W || !H) return;
  var capH = f.getAttribute("data-cap") ? 50 : 0;
  var r = Math.min(W / img.naturalWidth, (H - capH) / img.naturalHeight);
  var w = Math.round(img.naturalWidth * r), h = Math.round(img.naturalHeight * r);
  var top = f.classList.contains("top") ? 0 : Math.round((H - h - capH) / 2);
  box.style.width = w + "px"; box.style.height = h + "px";
  box.style.left = Math.round((W - w) / 2) + "px"; box.style.top = top + "px";
  var cap = f.querySelector(".figcap");
  if (cap) cap.style.top = (top + h + 8) + "px";
}

var HOOKS = {};
HOOKS.map = function (s) {

  }
};
HOOKS.form = function (s) {
  if (s >= 6 && !sortS.revealed) { sortS.revealed = true; sortS.slots = LESSON[state.page].order.slice(); sortS.pool = []; sortS.marks = ["lit", "lit", "lit", "lit"]; sortS.sel = null; renderSort(true); }
  else if (s < 6 && sortS.revealed) { resetSort(); }
  if (s >= 6) addBoard("form");
};
HOOKS.house = function (s) { if (s >= 7) addBoard("house"); };
HOOKS.summary = function (s) {
  var bb = $("bigboard"); if (!bb) return;
  bb.classList.toggle("hiliting", s > 0);
  var blks = bb.querySelectorAll(".bd-blk");
  for (var i = 0; i < blks.length; i++) blks[i].classList.toggle("hi", +blks[i].getAttribute("data-blk") === s);
};
HOOKS.quiz = function (s) {
  var P = cur();
  [[1, P.q1, 1], [3, P.q3, 6]].forEach(function (a) {
    var cards = pageEl.querySelectorAll('.ox[data-q="' + a[0] + '"]');
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i], v = c.getAttribute("data-v");
      c.classList.toggle("sel", oxSel[a[0]] === v && s < a[2]);
      c.classList.toggle("ok", s >= a[2] && v === a[1].ans);
      c.classList.toggle("dim", s >= a[2] && v !== a[1].ans);
    }
  });
  if (s >= 7) renderFinalScores();
};
function renderFinalScores() {
  var el = $("finalScores"); if (!el) return;
  var mx = Math.max.apply(null, state.scores);
  el.innerHTML = state.scores.map(function (v, i) {
    var top = mx > 0 && v === mx;

  }).join("");

/* ---------- 第 3 頁：排序遊戲 ---------- */
function resetSort() {
  var P = LESSON[idx("form")];
  sortS = { slots: [-1, -1, -1, -1], pool: P.cards.map(function (c, i) { return i; }), marks: [], sel: null, revealed: false };
  renderSort();
}
function renderSort(seq) {
  var P = LESSON[idx("form")], sl = $("slots"), pl = $("pool");
  if (!sl || !pl) return;
  function card(id) { return '<div class="card' + (sortS.sel === id ? " sel" : "") + '" data-id="' + id + '">' + P.cards[id] + '</div>'; }
  var h = "";
  for (var i = 0; i < 4; i++) {
    var m = sortS.marks[i] || "";
    h += '<div class="slot ' + (m === "lit" ? "good lit" : m) + '" data-i="' + i + '"' + (seq ? ' style="animation-delay:' + (i * 450) + 'ms"' : "") + '><span class="sn">' + (i + 1) + '</span>' + (sortS.slots[i] >= 0 ? card(sortS.slots[i]) : "") + '</div>';
    if (i < 3) h += ARROW;
  }
  sl.innerHTML = h;
  pl.innerHTML = sortS.pool.length ? sortS.pool.map(card).join("") : '<span class="hint">卡片都放好了！按「檢查答案」看看。</span>';
  var msg = $("sortMsg"); if (msg) msg.textContent = sortS.msg || "";
}
function placeCard(id, i) {
  var from = sortS.slots.indexOf(id), occ = sortS.slots[i];
  sortS.sel = null; sortS.msg = "";
  if (from === i) { renderSort(); return; }
  if (from >= 0) sortS.slots[from] = occ >= 0 ? occ : -1;
  else { sortS.pool.splice(sortS.pool.indexOf(id), 1); if (occ >= 0) sortS.pool.push(occ); }
  sortS.slots[i] = id;
  sortS.marks = [];
  renderSort();
}
function toPool(id) {
  var from = sortS.slots.indexOf(id);
  if (from >= 0) { sortS.slots[from] = -1; sortS.pool.push(id); }
  sortS.sel = null; sortS.marks = []; renderSort();
}
function checkSort() {
  var order = LESSON[idx("form")].order, bad = [], allOk = true;
  sortS.marks = [];
  for (var i = 0; i < 4; i++) {
    if (sortS.slots[i] === order[i]) sortS.marks[i] = "good";
    else { allOk = false; if (sortS.slots[i] >= 0) { sortS.marks[i] = "bad shake"; bad.push(i); } else sortS.marks[i] = "shake"; }
  }
  sortS.msg = allOk ? "全部正確！" : "";
  renderSort();
  if (bad.length) setTimeout(function () {
    bad.forEach(function (i) { if (sortS.slots[i] >= 0) { sortS.pool.push(sortS.slots[i]); sortS.slots[i] = -1; } sortS.marks[i] = ""; });
    renderSort();
  }, 650);
  else setTimeout(function () { for (var i = 0; i < 4; i++) if (sortS.marks[i] === "shake") sortS.marks[i] = ""; renderSort(); }, 450);
}

/* 自製拖曳：mousedown / mousemove / mouseup */
var drag = null;
function toStage(e) { var r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
pageEl.addEventListener("mousedown", function (e) {
  if (e.button !== 0) return;
  var c = e.target.closest(".card");
  if (!c || cur().id !== "form" || state.step !== 5) return;
  e.preventDefault();
  drag = { id: +c.getAttribute("data-id"), el: c, sx: e.clientX, sy: e.clientY, moved: false };
});
document.addEventListener("mousemove", function (e) {
  if (!drag) return;
  if (!drag.moved && Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 6) {
    drag.moved = true;
    var r = drag.el.getBoundingClientRect();
    drag.offX = (drag.sx - r.left) / scale; drag.offY = (drag.sy - r.top) / scale;
    drag.ghost = drag.el.cloneNode(true);
    drag.ghost.className = "card ghost";
    stage.appendChild(drag.ghost);
    drag.el.classList.add("dragging");
  }
  if (drag.moved) {
    var p = toStage(e);
    drag.ghost.style.left = (p.x - drag.offX) + "px"; drag.ghost.style.top = (p.y - drag.offY) + "px";
    var hov = pageEl.querySelectorAll(".slot.hover"); for (var i = 0; i < hov.length; i++) hov[i].classList.remove("hover");
    var t = document.elementFromPoint(e.clientX, e.clientY), s = t && t.closest(".slot");
    if (s) s.classList.add("hover");
  }
});
document.addEventListener("mouseup", function (e) {
  if (!drag) return;
  var d = drag; drag = null;
  if (d.moved) {
    if (d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    var t = document.elementFromPoint(e.clientX, e.clientY), s = t && t.closest(".slot");
    if (s) placeCard(d.id, +s.getAttribute("data-i"));
    else if (t && t.closest(".pool")) toPool(d.id);
    else renderSort();
  } else {
    // 只切換 class、不重繪，接下來的 click 事件才會正常落在卡片上
    sortS.sel = (sortS.sel === d.id) ? null : d.id;
    var cs = pageEl.querySelectorAll(".card");
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle("sel", +cs[i].getAttribute("data-id") === sortS.sel);
  }
});

function applySteps() {
  var s = curStep(), els = pageEl.querySelectorAll("[data-s]");
  for (var i = 0; i < els.length; i++) {
    var el = els[i], a = +el.getAttribute("data-s"), b = el.getAttribute("data-e");
    var on = s >= a && (b === null || s <= +b);
    if (el.classList.contains("scene")) el.style.display = on ? "" : "none";
    else el.classList.toggle("on", on);
  }
  var P = cur();
  if (HOOKS[P.type]) HOOKS[P.type](s);
  fitAll();
  renderProgress(); renderNotes(); updateTimer(); renderNav(); save();
}
function renderAll() { renderPage(); renderScore(); renderBoard(); applyToggles(); }

function renderProgress() {
  var st = cur().stage, h = "";
  for (var i = 1; i <= 3; i++) h += '<div class="pg' + (st === i ? " on" : (st > i ? " past" : "")) + '">' + STAGE_NAMES[i - 1] + '</div>';

  }).join("");
}
function addScore(i, d) {
  state.scores[i] = Math.max(0, state.scores[i] + d);
  var el = $("ts" + i);
  if (el) { el.textContent = state.scores[i]; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
  if (cur().type === "quiz" && state.step >= 7) renderFinalScores();

}
function addBoard(key) {
  if (state.flags[key]) return;

function renderBoard() { $("boardInner").innerHTML = boardHTML(state.flags, false); }
function renderNotes() {

  $("noteStrip").innerHTML = "<b>教師提示｜" + title + "</b>　" + txt;
}
function applyToggles() {
  $("score").classList.toggle("hide", !state.showScore);
  $("timer").classList.toggle("hide", !state.showTimer);
  document.body.classList.toggle("nob", !state.bubbles);
  $("noteStrip").classList.toggle("show", ui.notes);
}

/* ---------- 計時器 ---------- */
function updateTimer() {
  var P = cur(), el = $("timer");
  var el2 = state.tStart ? (Date.now() - state.tStart) / 1000 : 0;
  var seg = P.timer ? P.timer.name + " " + fmtShort(P.timer.from) + "–" + fmtShort(P.timer.to) : (state.page === 0 ? "封面" : "課後資源");
  if (P.type === "map" && state.station >= 0) seg += "（第" + NUMS[state.station] + "站）";
  el.innerHTML = "<b>" + fmt(el2) + "</b>" + seg;
  el.classList.toggle("over", !!(P.timer && state.tStart && el2 > P.timer.to));
}
setInterval(updateTimer, 500);

/* =====================================================================
   八、換頁邏輯
   ===================================================================== */
function goPage(i, last) {
  if (i < 0 || i >= LESSON.length) return;
  if (i >= 1 && !state.tStart && state.page === 0) state.tStart = Date.now();
  state.page = i; state.station = -1; state.stStep = 0;
  state.step = last ? LESSON[i].steps : 0;
  if (LESSON[i].type === "summary") { ["form", "house", "b1", "b2", "b3", "b4"].forEach(function (k) { state.flags[k] = true; }); renderBoard(); $("board").classList.remove("open"); }
  renderPage();
}
function openStation(i) { state.station = i; state.stStep = 0; renderPage(); }
function closeStation() { state.station = -1; state.stStep = 0; renderPage(); }
function completeStation() {
  var i = state.station, wasAll = state.stamps.every(function (x) { return x; });
  state.stamps[i] = true;
  addBoard(STATIONS[i].key);
  state.station = -1; state.stStep = 0;
  renderPage();
  var seal = $("seal" + i);
  if (seal) { var svg = seal.querySelector("svg"); if (svg) svg.classList.add("stamping"); }
  if (!wasAll && state.stamps.every(function (x) { return x; })) toast("集滿 4 個印章！導覽任務完成！");
}
function next() {
  var P = cur();
  if (P.type === "map") {
    if (state.station >= 0) {
      if (state.stStep < 3) { state.stStep++; applySteps(); } else completeStation();
    } else {
      var n = state.stamps.indexOf(false);
      if (n >= 0) openStation(n); else goPage(state.page + 1);
    }
    return;
  }
  if (state.step < P.steps) { state.step++; applySteps(); }
  else goPage(state.page + 1);
}
function prev() {
  var P = cur();
  if (P.type === "map") {
    if (state.station >= 0) { if (state.stStep > 0) { state.stStep--; applySteps(); } else closeStation(); }
    else goPage(state.page - 1, true);
    return;
  }
  if (state.step > 0) { state.step--; applySteps(); }
  else if (state.page > 0) goPage(state.page - 1, true);
}

/* =====================================================================
   九、彈出框、提示
   ===================================================================== */
var toastT = null;
function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 1800); }
function openModal(html, onOk) { var m = $("modal"); m.innerHTML = '<div class="mbox">' + html + '</div>'; m.classList.add("show"); ui.modal = { ok: onOk }; }
function closeModal() { $("modal").classList.remove("show"); ui.modal = null; }
function askReset() {
  openModal('<h2>重置所有進度？</h2><p>頁面、分數、印章、板書和計時器都會歸零。</p><div class="mbtns"><button data-act="cancel">取消（Esc）</button><button class="danger" data-act="ok">確定重置（Enter）</button></div>', doReset);
}
function doReset() {
  closeModal();
  state = defaultState(); optSel = {}; oxSel = {}; ui.notes = false;
  $("board").classList.remove("open"); $("boardTab").classList.remove("new");
  renderAll(); toast("已重置");
}
function showHelp() {
  var k = [["→ / 空白 / PageDown", "下一步（全部揭曉後換頁）"], ["← / PageUp", "上一步"], ["Home", "回到封面"], ["1 2 3 4", "幫該組加 1 分"],
    ["點組名", "+1（Shift+點 −1）"], ["S", "顯示／隱藏加分板"], ["T", "顯示／隱藏計時器"], ["0", "計時器歸零重新開始"],
    ["B", "開／關電子板書"], ["A", "顯示／隱藏學生可能回答"], ["N", "教師提示字條"], ["P", "講稿總表（可列印）"],
    ["F", "全螢幕"], ["R", "重置全部"], ["?", "這個說明"], ["Esc", "關閉視窗"]];
  openModal('<h2>快捷鍵</h2><div class="keys">' + k.map(function (x) { return "<div><kbd>" + x[0] + "</kbd>" + x[1] + "</div>"; }).join("") + '</div><div class="mbtns"><button data-act="cancel">關閉（Esc）</button></div>', closeModal);
}
function toggleFull() {
  var d = document, el = d.documentElement;
  if (!d.fullscreenElement && !d.webkitFullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
  else { (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
}

/* ---------- 講稿總表 ---------- */
function buildNotesView() {
  function qs(list) { return list.length ? list.map(function (q) { return '<div><span class="lvl">' + q[1] + '</span>' + q[0] + '</div>'; }).join("") : "—"; }
  function strip(s) { return s.replace(/<[^>]+>/g, ""); }
  var rows = "";
  LESSON.forEach(function (P, i) {
    var t = P.timer ? fmtShort(P.timer.from) + "–" + fmtShort(P.timer.to) : "—";
    var st = P.stage ? STAGE_NAMES[P.stage - 1] : (i === 0 ? "封面" : "課後");
    rows += "<tr><td>" + i + (P.header ? "<br>" + (P.header || "") : "<br>封面") + "</td><td>" + st + "</td><td>" + t + "</td><td>" + P.focus + "</td><td>" + qs(P.qs) + "</td><td>" + strip(P.notes) + "</td></tr>";
    if (P.type === "map") STATIONS.forEach(function (S, k) {
      rows += "<tr><td>2-" + NUMS[k] + "<br>" + S.name + "</td><td>發展活動</td><td>約 1 分鐘</td><td>" + S.focus + "</td><td>" + qs(S.qs) + "</td><td>" + strip(S.notes) + "</td></tr>";
    });
  });
  $("notesView").innerHTML =
    '<div class="tools"><button onclick="window.print()">列印（A4 直式）</button><button onclick="closeNotesView()">回到上課畫面（Esc）</button></div>' +
    '<h1>老街與生活｜15 分鐘試教講稿總表</h1><div class="meta">康軒社會四上 第三單元 第 2 課（課本 p.62–65）　試教者：' + (TEACHER_NAME || "＿＿＿＿") + '</div>' +
    '<div class="flow"><div><b>引起動機</b> 0:00–2:00（2 分）<br>找不同：三峽老街街景</div><div><b>發展活動</b> 2:00–13:00（11 分）<br>導覽地圖 4 站／老街形成／街屋空間</div><div><b>綜合活動</b> 13:00–15:00（2 分）<br>板書總結／快問快答</div></div>' +
    '<table><thead><tr><th style="width:11%">頁次</th><th style="width:8%">階段</th><th style="width:9%">建議時間</th><th style="width:19%">教學重點</th><th style="width:25%">提問（層次）</th><th>教師提示</th></tr></thead><tbody>' + rows + '</tbody></table>';
}
function openNotesView() { buildNotesView(); document.body.classList.add("notes"); ui.notesView = true; if (location.hash !== "#notes") { try { history.replaceState(null, "", "#notes"); } catch (e) { location.hash = "notes"; } } }
function closeNotesView() { document.body.classList.remove("notes"); ui.notesView = false; try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} fit(); fitAll(); }
window.addEventListener("hashchange", function () { if (location.hash === "#notes") openNotesView(); });

/* =====================================================================
   十、事件
   ===================================================================== */
document.addEventListener("keydown", function (e) {
  var k = e.key;
  if (ui.notesView) { if (k === "Escape" || k === "p" || k === "P") { e.preventDefault(); closeNotesView(); } return; }
  if (ui.modal) {
    if (k === "Escape") closeModal(); else if (k === "Enter" && ui.modal.ok) ui.modal.ok();
    e.preventDefault(); return;
  }
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (k === "?" || (k === "/" && e.shiftKey)) { e.preventDefault(); showHelp(); return; }
  switch (k) {
    case "ArrowRight": case " ": case "Spacebar": case "PageDown": case "Enter": e.preventDefault(); next(); return;
    case "ArrowLeft": case "PageUp": case "Backspace": e.preventDefault(); prev(); return;
    case "Home": e.preventDefault(); goPage(0); return;
    case "1": case "2": case "3": case "4": addScore(+k - 1, 1); return;
  }
  switch (k.toLowerCase()) {
    case "s": state.showScore = !state.showScore; applyToggles(); save(); break;
    case "t": state.showTimer = !state.showTimer; applyToggles(); save(); break;
    case "0": state.tStart = Date.now(); updateTimer(); save(); toast("計時器歸零"); break;
    case "b": $("board").classList.toggle("open"); $("boardTab").classList.remove("new"); break;
    case "a": state.bubbles = !state.bubbles; applyToggles(); save(); break;
    case "n": ui.notes = !ui.notes; applyToggles(); break;
    case "p": openNotesView(); break;
    case "f": toggleFull(); break;
    case "r": askReset(); break;
    case "escape": $("board").classList.remove("open"); ui.notes = false; applyToggles(); break;
  }
});

pageEl.addEventListener("click", function (e) {
  var t = e.target, el;
  if ((el = t.closest(".mapbtn"))) { openStation(+el.getAttribute("data-i")); return; }
  if (t.closest(".backmap")) { closeStation(); return; }
  if (t.closest(".stampbtn")) { completeStation(); return; }
  if ((el = t.closest(".opt")) && state.station >= 0 && state.stStep < 3) {
    var st = STATIONS[state.station], o = +el.getAttribute("data-o"), sel = optSel[state.station] || (optSel[state.station] = {});
    if (st.layout === "choice") { var was = sel[o]; optSel[state.station] = {}; if (!was) optSel[state.station][o] = true; }
    else sel[o] = !sel[o];
    HOOKS.map(state.stStep); return;
  }
  if ((el = t.closest(".ox"))) { var q = el.getAttribute("data-q"), v = el.getAttribute("data-v"); oxSel[q] = oxSel[q] === v ? null : v; HOOKS.quiz(state.step); return; }
  if (cur().id === "form" && state.step === 5) {
    if (t.closest("#btnCheck")) { checkSort(); return; }
    if (t.closest("#btnShuffle")) { resetSort(); return; }
    if (t.closest(".card")) return;
    if ((el = t.closest(".slot")) && sortS.sel !== null) { placeCard(sortS.sel, +el.getAttribute("data-i")); return; }
    if (t.closest(".pool") && sortS.sel !== null) { toPool(sortS.sel); return; }
  }
});
$("score").addEventListener("click", function (e) { var el = e.target.closest(".team"); if (el) addScore(+el.getAttribute("data-t"), e.shiftKey ? -1 : 1); });
$("score").addEventListener("mousedown", function (e) { if (e.shiftKey) e.preventDefault(); });
$("boardTab").addEventListener("click", function () { $("board").classList.toggle("open"); $("boardTab").classList.remove("new"); });
$("btnNext").addEventListener("click", next);
$("btnPrev").addEventListener("click", prev);
$("modal").addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]");
  if (b) { if (b.getAttribute("data-act") === "ok" && ui.modal && ui.modal.ok) ui.modal.ok(); else closeModal(); }
  else if (e.target === $("modal")) closeModal();
});
// 點按鈕後移除焦點，避免空白鍵重複觸發按鈕
document.addEventListener("mouseup", function () { setTimeout(function () { if (document.activeElement && document.activeElement.tagName === "BUTTON") document.activeElement.blur(); }, 0); });

/* ---------- 等比例縮放（16:9 舞台） ---------- */
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  scale = Math.min(w / 1920, h / 1080);
  stage.style.transform = "scale(" + scale + ")";
  stage.style.left = Math.round((w - 1920 * scale) / 2) + "px";
  stage.style.top = Math.round((h - 1080 * scale) / 2) + "px";
}
window.addEventListener("resize", fit);

/* ---------- 啟動 ---------- */
load();
fit();
renderAll();
if (location.hash === "#notes") openNotesView();
</script>
</body>
</html>
